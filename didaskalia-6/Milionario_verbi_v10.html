<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi vuol essere milionario? – Maestra Crissa</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#382777,#080d29 75%);color:#fff;font:17px system-ui,sans-serif;min-height:100vh}header{text-align:center;padding:24px}h1{color:#ffdc80;margin:8px;font-size:clamp(26px,5vw,44px)}main{max-width:1050px;margin:auto;padding:16px;display:grid;grid-template-columns:1fr 240px;gap:22px}.panel,aside{background:#10183d;border:1px solid #8e7cc7;border-radius:24px;padding:24px}button{font:inherit;color:white;background:#25245c;border:1px solid #a79cdd;border-radius:18px;padding:14px;cursor:pointer}button:hover:not(:disabled){background:#49418b}button:disabled{cursor:default;opacity:.5}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{text-align:left;min-height:65px}.answers button.correct{background:#167447;opacity:1}.answers button.wrong{background:#a52b40;opacity:1}.help{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.help button{font-size:14px}#ladder{list-style:none;padding:0;margin:0}#ladder li{padding:5px 12px;border-radius:10px;display:flex;justify-content:space-between;color:#f6d998}#ladder .current{background:#f4c45b;color:#17142d;font-weight:bold}#ladder .safe{border:1px solid #8e7cc7}#ladder .passed{color:#83e3b4}#feedback{min-height:55px;line-height:1.5}#question{line-height:1.5}footer{text-align:center;padding:24px;color:#d7c9ff}@media(max-width:700px){main{grid-template-columns:1fr}.panel,aside{padding:16px}.answers{grid-template-columns:1fr}aside{order:2}}#reward{margin:18px 0 8px;padding:18px;text-align:center;border-radius:18px;border:2px solid #ffdc80;background:#24214c;color:#ffdc80}#reward[hidden]{display:none}#reward strong{display:block;font-size:clamp(25px,5vw,42px);margin:8px 0}#reward.loss{border-color:#ef9ba9;color:#ffd5db}#reward.win{animation:pop .45s ease-out}@keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){#reward.win{animation:none}}#poll{margin:18px 0;padding:16px;border:1px solid #8e7cc7;border-radius:18px;background:#191d48;text-align:center}#poll[hidden]{display:none}#poll h3{margin:0 0 12px;color:#ffdc80}.poll-bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.poll-track{height:145px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid #a79cdd}.poll-bar{width:65%;position:relative;border-radius:5px 5px 0 0;animation:rise .5s ease-out;transform-origin:bottom}.poll-bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-weight:bold;color:white;white-space:nowrap}.poll-label{margin-top:7px;font-weight:bold}@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.poll-bar{animation:none}}</style><header><div>★ MAESTRA CRISSA ★</div><h1>Chi vuol essere milionario?</h1></header><main><section class="panel"><div class="help"><button id="half">50:50</button><button id="crowd">👥 Κοινό</button><button id="teacher">📞 Τηλέφωνο</button></div><div id="progress"></div><h2 id="question"></h2><div class="answers" id="answers"></div><section id="poll" aria-live="polite" hidden></section><div id="reward" role="status" aria-live="polite" hidden></div><p id="feedback" aria-live="polite"></p><button id="restart">Νέο παιχνίδι</button> <button id="sound" aria-pressed="true">🔊 Ήχος</button></section><aside><ol id="ladder"></ol></aside></main><script>
const questions=[
['Io ___ italiano. (parlare)',['parli','parlo','parla','parlano'],1,'Στο io η κατάληξη είναι -o.'],
['Tu ___ un libro. (leggere)',['legge','leggo','leggiamo','leggi'],3,'Στο tu η κατάληξη είναι -i.'],
['Ποιο ρήμα ανήκει στην 3η συζυγία;',['aprire','studiare','prendere','giocare'],0,'Η τρίτη συζυγία έχει απαρέμφατο σε -IRE.'],
['Noi ___ la porta. (aprire)',['aprite','aprono','apriamo','apri'],2,'Στο noi η κατάληξη είναι -iamo.'],
['Loro ___ la lezione. (finire)',['finiscono','finono','finisce','finiamo'],0,'Στο loro το finire παίρνει -iscono.'],
['Voi ___ un libro. (scrivere)',['scrivite','scrivete','scrivono','scriviamo'],1,'Στο voi τα ρήματα σε -ERE παίρνουν -ete.'],
['Tu ___ a calcio. (giocare)',['gioci','gioca','giochi','giochiamo'],2,'Πριν από i χρειάζεται h για να διατηρηθεί ο ήχος του c.'],
['Noi ___ il conto. (pagare)',['pagiamo','pagate','pagano','paghiamo'],3,'Στο noi το pagare παίρνει h.'],
['Tu ___ italiano. (studiare)',['studii','studi','studia','studio'],1,'Στο tu δεν διπλασιάζουμε το i.'],
['Voi ___ la finestra. (aprire)',['aprete','apriamo','aprite','aprisce'],2,'Στο voi η κατάληξη είναι -ite.'],
['Lei ___ la domanda. (capire)',['capisce','capisci','capite','capiamo'],0,'Στο lei το capire παίρνει -isce.'],
['Ποια πρόσωπα ΔΕΝ παίρνουν -isc- στο finire;',['io e tu','lui e lei','tu e loro','noi e voi'],3,'Στο noi και στο voi δεν προστίθεται -isc-.'],
['Noi ___ la pizza. (mangiare)',['mangiiamo','manghiamo','mangiamo','mangiate'],2,'Στο noi γράφουμε mangiamo με ένα i.'],
['Ποια πρόταση είναι σωστή;',['Voi finiscite.','Loro prendono.','Tu paghiamo.','Noi aprite.'],1,'Στο loro το prendere παίρνει -ono.'],
['Ποια σειρά είναι ολόκληρη σωστή;',['Tu giochi – voi prendete – loro finiscono','Tu gioci – voi prendete – loro finiscono','Tu giochi – voi prendite – loro finiscono','Tu giochi – voi prendete – loro finono'],0,'Giocare: giochi · prendere: prendete · finire: finiscono.']];
const prizes=[100,200,300,500,1000,1500,2000,3000,4000,5000,10000,20000,35000,60000,100000];const $=id=>document.getElementById(id);let i=0,locked=false,ended=false,used={},hidden=[],sound=true,nextTimer=null;const money=n=>n.toLocaleString('el-GR')+' €';function tone(ok){if(!sound)return;try{const a=new (window.AudioContext||window.webkitAudioContext)();a.resume().catch(()=>{});const notes=ok?[523.25,659.25,783.99,1046.5,783.99,1046.5]:[392,329.63,261.63,196];const step=ok?.13:.24;notes.forEach((f,x)=>{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+.03+x*step,d=x===notes.length-1?.45:step+.06;o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.13,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)});setTimeout(()=>a.close(),1800)}catch(e){}}function reward(ok,amount){const r=$('reward');r.className=ok?'win':'loss';r.replaceChildren();const title=document.createElement('div');title.textContent=ok?'🎉 OTTIMO LAVORO!!! 🎉':'Ωχ! Λάθος απάντηση!';const value=document.createElement('strong');value.textContent=(ok?'Κέρδισες ':'Εξασφάλισες ')+money(amount)+'!';r.append(title,value);if(ok&&[3,9,14].includes(i)){const safe=document.createElement('div');safe.textContent=i===14?'🏆 Κατέκτησες το μεγάλο έπαθλο!':'⭐ Κατέκτησες το μαξιλαράκι ασφαλείας!';r.append(safe)}r.hidden=false;}function render(){locked=false;ended=false;hidden=[];$('poll').hidden=true;$('poll').replaceChildren();$('reward').hidden=true;$('feedback').textContent='';$('progress').textContent=`Ερώτηση ${i+1} / 15 · ${money(prizes[i])}`;$('question').textContent=questions[i][0];$('answers').replaceChildren();questions[i][1].forEach((v,j)=>{const b=document.createElement('button');b.textContent='ΑΒΓΔ'[j]+': '+v;b.onclick=()=>answer(j);$('answers').append(b)});['half','crowd','teacher'].forEach(k=>$(k).disabled=!!used[k]);ladder()}function ladder(){$('ladder').innerHTML=prizes.map((p,j)=>`<li class="${j===i?'current ':''}${j===3||j===9||j===14?'safe ':''}${j<i?'passed':''}"><span>${j+1}</span><span>${[3,9,14].includes(j)?"★ ":""}${money(p)}</span></li>`).reverse().join('')}function answer(j){if(locked||ended)return;locked=true;const q=questions[i],ok=j===q[2];[...$('answers').children].forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===j&&!ok)b.classList.add('wrong')});['half','crowd','teacher'].forEach(k=>$(k).disabled=true);tone(ok);reward(ok,ok?prizes[i]:i>=10?prizes[9]:i>=4?prizes[3]:0);if(ok&&i<14){$('feedback').textContent=q[3];nextTimer=setTimeout(()=>{nextTimer=null;i++;render()},3000)}else{ended=true;const amount=ok?prizes[14]:i>=10?prizes[9]:i>=4?prizes[3]:0;$('feedback').textContent=(ok?'🏆 Συγχαρητήρια! Κέρδισες το μεγάλο έπαθλο!':'Η σωστή απάντηση είναι: '+q[1][q[2]]+'. '+q[3])+' Τελικό εικονικό έπαθλο: '+money(amount);}}$('restart').onclick=()=>{clearTimeout(nextTimer);nextTimer=null;i=0;used={};render()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Ήχος':'🔇 Ήχος';$('sound').setAttribute('aria-pressed',sound)};function help(k){if(locked||ended||used[k])return;used[k]=true;$(k).disabled=true;const q=questions[i];if(k==='half'){hidden=[0,1,2,3].filter(j=>j!==q[2]).slice(0,2);hidden.forEach(j=>{$('answers').children[j].disabled=true;$('answers').children[j].style.visibility='hidden'})}if(k==='teacher')$('feedback').textContent='📞 Πήρες τηλέφωνο τη maestra Crissa και εκείνη σου λέει ότι η σωστή απάντηση είναι: '+q[1][q[2]]+'!';if(k==='crowd'){const visible=[0,1,2,3].filter(j=>!hidden.includes(j));const rest=visible.filter(j=>j!==q[2]);const values=[0,0,0,0];values[q[2]]=70;rest.forEach((j,n)=>values[j]=Math.floor(30/rest.length)+(n<30%rest.length?1:0));const poll=$('poll');poll.replaceChildren();const heading=document.createElement('h3');heading.textContent='👥 Η ψηφοφορία του κοινού';const bars=document.createElement('div');bars.className='poll-bars';values.forEach((v,j)=>{const col=document.createElement('div'),track=document.createElement('div'),bar=document.createElement('div'),pct=document.createElement('span'),label=document.createElement('div');track.className='poll-track';bar.className='poll-bar';bar.style.height=v+'%';bar.style.background=['#a78bfa','#f4c45b','#60a5fa','#f472b6'][j];pct.textContent=v+'%';label.className='poll-label';label.textContent='ΑΒΓΔ'[j];bar.append(pct);track.append(bar);col.append(track,label);bars.append(col)});poll.append(heading,bars);poll.hidden=false}}['half','crowd','teacher'].forEach(k=>$(k).onclick=()=>help(k));render();</script></html>
