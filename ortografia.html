const grid=document.getElementById('grid'),result=document.getElementById('result');
items.forEach((item,i)=>{const card=document.createElement('article');card.className='card';const image=document.createElement('img');image.src=item.image;image.alt='Εικόνα για τη λέξη '+item.greek;const inner=document.createElement('div');inner.className='inner';const num=document.createElement('div');num.className='num';num.textContent='ΡΗΜΑ '+(i+1)+' / '+items.length;const gr=document.createElement('div');gr.className='greek';gr.textContent=item.greek;const input=document.createElement('input');input.type='text';input.autocomplete='off';input.autocapitalize='off';input.spellcheck=false;input.setAttribute('aria-label','Ιταλικό ρήμα για: '+item.greek);input.placeholder='Γράψε στα ιταλικά…';input.addEventListener('input',()=>{card.classList.remove('correct','incorrect');feedback.textContent='';result.classList.remove('show')});const feedback=document.createElement('div');feedback.className='feedback';inner.append(num,gr,input,feedback);card.append(image,inner);grid.append(card)});
document.getElementById('check').addEventListener('click',()=>{let right=0;[...grid.children].forEach((card,i)=>{const value=card.querySelector('input').value.trim().toLocaleLowerCase('it-IT');const normalized=value.normalize('NFC').replace(/[.,;\/\+&]+/g,' ').replace(/\s+(?:και|e|ή|oppure)\s+/g,' ').replace(/\s+/g,' ').trim();const answers=normalized.split(' ').filter(Boolean);const ok=items[i].word==='telefonare' ? (answers.length>0 && answers.every(a=>a==='telefonare'||a==='chiamare') && new Set(answers).size===answers.length) : value===items[i].word;if(ok)right++;card.classList.toggle('correct',ok);card.classList.toggle('incorrect',!ok);card.querySelector('.feedback').textContent=ok?'✓ Σωστά!':'✗ Σωστό: '+(items[i].word==='telefonare'?'telefonare ή chiamare':items[i].word)});const score=(right/items.length*20).toFixed(1).replace('.',',');result.innerHTML='<h2>Η τελική σου βαθμολογία</h2><div class="score">'+score+' / 20</div><p>Σωστές απαντήσεις: <strong>'+right+' / '+items.length+'</strong></p><p>'+(right===items.length?'Bravissimo! Τα κατάφερες τέλεια! 🎉':right>=9?'Molto bene! Συνέχισε την εξάσκηση! 🌟':'Καλή προσπάθεια! Δες τις διορθώσεις και δοκίμασε ξανά. 💪')+'</p><p class="note">Κάθε σωστή απάντηση μετρά ισότιμα. Η βαθμολογία υπολογίζεται στα 20.</p>';result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'center'})});document.getElementById('reset').addEventListener('click',()=>{[...grid.children].forEach(c=>{c.querySelector('input').value='';c.querySelector('.feedback').textContent='';c.classList.remove('correct','incorrect')});result.classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})});
</script></body></html>
